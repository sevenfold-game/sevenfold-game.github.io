<!doctype html><html data-theme="dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta http-equiv="refresh" content="0; url=https://mathillion.github.io/">
<title>Redirecting...</title>

<link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* Layout: one left-aligned column like a lab notebook page. The target numeral is the hero,
   a thin timer rule sits under it, and a rarity ruler appears when a round is scored. */
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --ink: #11151B; --ink-2: #505A69; --line: #D6DBE4; --line-2: #E6EAF0;
  --accent: #2B3BD6; --accent-ink: #FFFFFF; --good: #17804A; --bad: #C23B2A; --warn: #B7620B;
  --t0: #7B8696; --t1: #2F9E5F; --t2: #2D78E0; --t3: #7A55E0; --t4: #D69A00; --t5: #E15344; --t6: #02A272; --t7: #12161C; --t8: #8A5A2E;
  --tint: 14%;
  --f-display: 'Kanit', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'Intel One Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --shadow: 0 1px 0 rgba(17, 21, 27, .04), 0 8px 24px -12px rgba(17, 21, 27, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1217; --surface: #161B22; --ink: #EDF0F5; --ink-2: #9EA9B8; --line: #2A323D; --line-2: #212832;
    --accent: #8C99FF; --accent-ink: #0E1217; --good: #4CC083; --bad: #FF7B68; --warn: #F0A24A;
    --t0: #9AA5B5; --t1: #4CC083; --t2: #5E9BFF; --t3: #9E80FF; --t4: #F0BE3A; --t5: #FF7D6B; --t6: #05E9A5; --t7: #EDF0F5; --t8: #C9915A;
    --tint: 22%; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1217; --surface: #161B22; --ink: #EDF0F5; --ink-2: #9EA9B8; --line: #2A323D; --line-2: #212832;
  --accent: #8C99FF; --accent-ink: #0E1217; --good: #4CC083; --bad: #FF7B68; --warn: #F0A24A;
  --t0: #9AA5B5; --t1: #4CC083; --t2: #5E9BFF; --t3: #9E80FF; --t4: #F0BE3A; --t5: #FF7D6B; --t6: #FF6B9E; --t7: #EDF0F5; --t8: #C9915A;
  --tint: 22%; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-display); font-size: 16px; line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* masthead */
.mast { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 26px; letter-spacing: -0.02em; line-height: 1; }
.brand b { color: var(--accent); font-weight: 800; }
.issue { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; }
.pips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.pip { height: 6px; border-radius: 3px; background: var(--line); }
.pip.done { background: var(--ink); }
.pip.now { background: var(--accent); }

/* generic blocks */
.lede { font-size: clamp(26px, 6.4vw, 38px); font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; text-wrap: balance; margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; margin: 0 0 10px; }
ul.plain { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
ul.plain li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
ul.plain li::before { content: ""; width: 8px; height: 8px; margin-top: 8px; border-radius: 2px; background: var(--accent); }
.btn { border: 0; border-radius: 12px; padding: 14px 20px; font-weight: 600; font-size: 17px; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.sm { padding: 9px 14px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
details { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
details summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 10px; }
details p { margin: 6px 0; }
code, .code { font-family: var(--f-mono); font-size: 13px; background: var(--line-2); padding: 1px 6px; border-radius: 5px; }

/* tiers */
.tier { --c: var(--t0); display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 3px 11px 3px 9px;
  font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--c);
  background: color-mix(in srgb, var(--c) var(--tint), transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); white-space: nowrap; }
.tier::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tier[data-t="0"] { --c: var(--t0); } .tier[data-t="1"] { --c: var(--t1); } .tier[data-t="2"] { --c: var(--t2); } .tier[data-t="3"] { --c: var(--t3); }
.tier[data-t="4"] { --c: var(--t4); } .tier[data-t="5"] { --c: var(--t5); } .tier[data-t="6"] { --c: var(--t6); } .tier[data-t="7"] { --c: var(--t7); } .tier[data-t="8"] { --c: var(--t8); }
.tier[data-t="7"]::before { background: conic-gradient(from 0deg, #ff5f6d, #ffc371, #47e891, #4facfe, #b06ab3, #ff5f6d); }
.tier.big { font-size: 15px; padding: 5px 14px 5px 11px; }
.tier.big::before { width: 10px; height: 10px; }
.ladder { display: flex; flex-direction: column; }
.ladder .tr { display: grid; grid-template-columns: 124px 1fr; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line-2); }
.ladder .tr:first-child { border-top: 0; }

/* play */
.stage { display: flex; flex-direction: column; gap: 14px; }
.target-label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.target { font-family: var(--f-mono); font-weight: 600; font-size: clamp(54px, 17vw, 104px); line-height: 1; letter-spacing: -0.04em; overflow-wrap: anywhere; }
.clock { display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; width: 100%; background: var(--accent); transform-origin: left; border-radius: 4px; }
.clock.low .fill { background: var(--bad); }
.secs { font-family: var(--f-mono); font-weight: 600; font-size: 22px; min-width: 3.2ch; text-align: right; }
.clock.low .secs { color: var(--bad); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field input { width: 100%; font-family: var(--f-mono); font-size: 22px; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.field.shake input { animation: shake .32s; border-color: var(--bad); }
@keyframes shake { 20% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }
.live { min-height: 44px; font-family: var(--f-mono); font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.live .ok { color: var(--good); } .live .off { color: var(--warn); } .live .err { color: var(--bad); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button { font-family: var(--f-mono); font-size: 15px; min-width: 44px; min-height: 40px; padding: 4px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
.keys button:hover { border-color: var(--accent); }

/* reveal */
.pts { font-family: var(--f-mono); font-weight: 600; font-size: clamp(44px, 13vw, 72px); line-height: 1; letter-spacing: -0.03em; }
.pts small { font-size: 16px; letter-spacing: 0; color: var(--ink-2); font-weight: 400; margin-left: 6px; }
.expr { font-family: var(--f-mono); font-size: 17px; overflow-wrap: anywhere; padding: 10px 12px; border-radius: 10px; background: var(--line-2); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; align-items: baseline; }
.kv dt { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-family: var(--f-mono); }
.kv dd { margin: 0; min-width: 0; }
.ruler { position: relative; padding-top: 30px; }
.ruler .bar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; height: 14px; }
.ruler .bar i { border-radius: 3px; background: color-mix(in srgb, var(--c) 55%, var(--bg)); }
.ruler .bar i:nth-child(1) { --c: var(--t0); } .ruler .bar i:nth-child(2) { --c: var(--t1); } .ruler .bar i:nth-child(3) { --c: var(--t2); } .ruler .bar i:nth-child(4) { --c: var(--t3); }
.ruler .bar i:nth-child(5) { --c: var(--t4); } .ruler .bar i:nth-child(6) { --c: var(--t5); } .ruler .bar i:nth-child(7) { --c: var(--t6); }
.ruler .bar i:nth-child(8) { background: conic-gradient(from 90deg at 50% 50%, #ff5f6d, #ffc371, #47e891, #4facfe, #b06ab3, #ff5f6d); }
.ruler .mark { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; font-family: var(--f-mono); font-size: 11px; font-weight: 600; }
.ruler .mark::after { content: ""; width: 0; height: 0; border: 6px solid transparent; border-top-color: var(--ink); margin-top: 1px; }
.ruler .ticks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 6px; font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); }
.ruler .ticks span { overflow: hidden; text-overflow: clip; white-space: nowrap; }
.pending { color: var(--ink-2); font-family: var(--f-mono); font-size: 13px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* results */
.total { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rows { display: flex; flex-direction: column; }
.res { display: grid; grid-template-columns: 56px 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-2); }
.res:first-child { border-top: 0; }
.res .n { font-family: var(--f-mono); font-weight: 600; font-size: 18px; }
.res .e { min-width: 0; font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.res .p { font-family: var(--f-mono); font-weight: 600; text-align: right; }
.res .tcell { grid-column: 2 / 4; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.foot { font-size: 12px; color: var(--ink-2); font-family: var(--f-mono); }
/* sound toggle, reveal motion, overall tier, share, examples */
.mast .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mute { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.mute:hover { border-color: var(--accent); color: var(--ink); }
.ruler .bar i { opacity: .38; transition: opacity .25s ease; }
.ruler .bar i.lit { opacity: 1; }
.tier.pop { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.fade-in { animation: fadeUp .5s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.stag > * { animation: fadeUp .45s ease both; }
.stag > *:nth-child(1) { animation-delay: .05s; } .stag > *:nth-child(2) { animation-delay: .12s; } .stag > *:nth-child(3) { animation-delay: .19s; }
.stag > *:nth-child(4) { animation-delay: .26s; } .stag > *:nth-child(5) { animation-delay: .33s; } .stag > *:nth-child(6) { animation-delay: .4s; } .stag > *:nth-child(7) { animation-delay: .47s; }
.overall { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin-top: 14px; }
.overall .lab { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
#ovslot { min-height: 34px; }
.sharepanel { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
.share-img { width: 100%; max-width: 300px; border-radius: 12px; border: 1px solid var(--line); display: block; }
.stack { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; flex: 1; }
.exlist { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.exlist details { padding: 10px 12px; }
.exlist summary { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.exlist details[open] summary { margin-bottom: 8px; }
.exrow { display: grid; grid-template-columns: 112px 44px minmax(0, 1fr); gap: 6px 10px; align-items: baseline; padding: 8px 6px; border-top: 1px solid var(--line-2); }
.exrow.mine { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 8px; border-top-color: transparent; }
.exrow .xe { font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .field.shake input, .pending, .tier.pop, .fade-in, .stag > * { animation: none; } .btn:active { transform: none; } .ruler .bar i { transition: none; } }
</style>

<style>
/* galaxy background: fixed canvas behind everything; the page is forced dark so text stays readable over space */
#galaxy { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; display: block; pointer-events: none; }
#app { text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 14px rgba(0, 0, 0, .8); }
/* readability scrim: a soft dark panel behind the content column */
.wrap { max-width: 680px; background: rgba(3, 5, 10, .5); border-radius: 20px; padding: 22px 20px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .05), 0 0 60px 20px rgba(3, 5, 10, .45); }
:root[data-theme="dark"] { --ink-2: #BDC7D6; --line: #3A4452; --line-2: #2B3441; }
@media (max-width: 720px) { .wrap { background: rgba(3, 5, 10, .42); padding: 18px 14px; } }
</style>
<canvas id="galaxy" aria-hidden="true"></canvas>
<div class="wrap" id="app">
   <p>If you are not redirected automatically, <a href="https://mathillion.github.io/">click here to go to the new website</a>.</p>
</div>
