<style>
/* Layout: one left-aligned column like a lab notebook page. The target numeral is the hero,

:root {

  }
}

  --bg: #0E1217; --surface: #161B22; --ink: #EDF0F5; --ink-2: #9EA9B8; --line: #2A323D; --line-2: #212832;
  --accent: #8C99FF; --accent-ink: #0E1217; --good: #4CC083; --bad: #FF7B68; --warn: #F0A24A;

.sharepanel { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
.share-img { width: 100%; max-width: 300px; border-radius: 12px; border: 1px solid var(--line); display: block; }
.stack { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0; flex: 1; }
.exlist { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

.exrow { display: grid; grid-template-columns: 112px 44px minmax(0, 1fr); gap: 6px 10px; align-items: baseline; padding: 8px 6px; border-top: 1px solid var(--line-2); }

<script>
function makeCore() {
// ===== Part A: rationals, AST, parser, evaluator =====
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
class Overflow extends Error {}
class InputError extends Error {}

const N = (n, d = 1) => {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1; n /= g; d /= g;
  if (!Number.isSafeInteger(n) || !Number.isSafeInteger(d)) throw new Overflow();
  return { t: 'n', n, d };
};
const C = (name) => ({ t: 'c', name });
const ADD = (args) => ({ t: 'add', args });
const MUL = (args) => ({ t: 'mul', args });
const POW = (b, e) => ({ t: 'pow', b, e });
const FN = (name, args) => ({ t: 'fn', name, args });
const isNum = (x) => x.t === 'n';
const nval = (x) => x.n / x.d;
const radd = (a, b) => N(a.n * b.d + b.n * a.d, a.d * b.d);
const rmul = (a, b) => N(a.n * b.n, a.d * b.d);
const isInt = (x) => isNum(x) && x.d === 1;
const isNumV = (x, v) => isNum(x) && x.n === v && x.d === 1;

const CONSTS = { pi: Math.PI, e: Math.E, phi: (1 + Math.sqrt(5)) / 2, tau: 2 * Math.PI };

function factorial(n) {
  if (!Number.isInteger(n) || n < 0 || n > 170) throw new InputError('Factorial needs a whole number from 0 to 170');
  let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
}
// name -> [arity, impl]
const FUNCS = {
  sqrt: [1, null], exp: [1, null], root: [2, null], // sugar, handled by the parser
  cbrt: [1, Math.cbrt], abs: [1, Math.abs],
  sin: [1, Math.sin], cos: [1, Math.cos], tan: [1, Math.tan],
  asin: [1, Math.asin], acos: [1, Math.acos], atan: [1, Math.atan],
  sinh: [1, Math.sinh], cosh: [1, Math.cosh], tanh: [1, Math.tanh],
  ln: [1, Math.log], log: [1, Math.log10], log2: [1, Math.log2],
  logb: [2, (b, x) => Math.log(x) / Math.log(b)],
  floor: [1, Math.floor], ceil: [1, Math.ceil], round: [1, (x) => Math.floor(x + 0.5)],
  fact: [1, factorial],
  mod: [2, (a, b) => a - b * Math.floor(a / b)],
};

// ---------- tokenizer ----------
function splitIdent(id) {
  // "epi" -> ["e","pi"]; null when it is not made only of constants
  const names = ['phi', 'tau', 'pi', 'e'];
  const go = (s) => {
    if (!s) return [];
    for (const n of names) if (s.startsWith(n)) { const r = go(s.slice(n.length)); if (r) return [n, ...r]; }
    return null;
  };
  return go(id);
}
function tokenize(src) {
  const s = src.toLowerCase()
    .replace(/×|·|⋅/g, '*').replace(/÷/g, '/').replace(/[−–—]/g, '-')
    .replace(/π/g, 'pi').replace(/φ/g, 'phi').replace(/τ/g, 'tau')
    .replace(/√/g, 'sqrt').replace(/²/g, '^2').replace(/³/g, '^3')
    .replace(/\*\*/g, '^');
  const out = []; let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    let m;
    if ((m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)))) { out.push({ k: 'num', v: m[1] }); i += m[1].length; continue; }
    if ((m = /^[a-z]+/.exec(s.slice(i)))) {
      let id = m[0];
      if ((id === 'log' && /^2\s*\(/.test(s.slice(i + 3)))) { id = 'log2'; i += 1; }
      i += m[0].length;
      if (id === 'log2') { i += 0; }
      if (FUNCS[id] || id in CONSTS) { out.push({ k: 'id', v: id }); continue; }
      const parts = splitIdent(id);
      if (!parts) throw new InputError(`Unknown name "${m[0]}"`);
      parts.forEach((p, j) => { if (j) out.push({ k: 'op', v: '*' }); out.push({ k: 'id', v: p }); });
      continue;
    }
    if ('+-*/^(),!%'.includes(ch)) { out.push({ k: 'op', v: ch }); i++; continue; }
    throw new InputError(`Unexpected "${ch}"`);
  }
  return out;
}

// ---------- parser ----------
function decimalToN(str) {
  const [ip, fp = ''] = str.split('.');
  if (fp.length > 9) throw new InputError('Too many decimal places (9 max)');
  return N(Number(ip + fp), Math.pow(10, fp.length));
}
function parse(src) {
  if (src.length > 240) throw new InputError('Expression is too long (240 characters max)');
  const toks = tokenize(src);
  if (!toks.length) throw new InputError('Type an expression');
  let p = 0, depth = 0;
  const peek = () => toks[p];

  function rulerHtml(P) {
    var ticks = '';
    for (var i = 0; i < 8; i++) ticks += '<span>' + (i === 0 ? 0 : Math.round(P[i - 1])) + '</span>';
    return '<div class="ruler" role="img" aria-label="Your score on the rarity scale for this number"><div class="mark" id="mark" style="left:3%"><span id="marknum">0</span></div>' +
      '<div class="bar" id="bar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="ticks">' + ticks + '</div></div>';
  }
  function setMark(P, v) {
    var m = document.getElementById('mark'); if (!m) return;
    var p = rulerX(P, v); m.style.left = p.x.toFixed(2) + '%';
    document.getElementById('marknum').textContent = Math.round(v);
    var bars = document.querySelectorAll('#bar i');
    for (var i = 0; i < bars.length; i++) bars[i].classList.toggle('lit', i <= p.seg);
  }
  function setPts(v) { var el = document.getElementById('ptsnum'); if (el) el.textContent = v; BG.set(baseBefore(S.idx) + v); }
  function renderReveal() {
    stopTimers();
    var i = S.idx, r = S.results[i], last = i === 6;
    BG.set(visiblePts());
    var body;
    if (r.ok) {
      body = '<div class="row" style="gap:14px"><div class="pts"><span id="ptsnum">' + (r.shown ? r.pts : 0) + '</span><small>points</small></div><div id="tslot"><span class="pending">weighing rarity…</span></div></div>' +
        '<div class="muted" id="tdesc" style="min-height:24px"></div><div id="ruler"></div>' +
        '<dl class="kv"><dt>Submitted:</dt><dd class="mono small">' + esc(r.input) + '</dd><dt>Simplified:</dt><dd><div class="expr">' + esc(r.text) + '</div>' +
        (r.pruned ? '<div class="small muted" style="margin-top:6px">Redundant parts of the expression were removed.</div>' : '') +
        (r.simplified === false ? '<div class="small muted" style="margin-top:6px">Nice! Every part of this expression contributed meaningfully.</div>' : '') + '</dd></dl>';
    } else {
      var why = r.reason === 'skip' ? 'Skipped this one.' : (r.input ? (r.miss !== undefined ? 'Time ran out sadly. The expression became ' + esc(fmtV(r.miss)) + '.' : 'Time ran out without a valid expression.') : 'Time ran out with nothing submitted.');
      body = '<div class="pts fade-in">0<small>points</small></div><p class="muted fade-in" style="margin:0">' + why + '</p>';
    }
    app.innerHTML = mast() + pips() +
      '<div class="card stage"><div class="target-label"><span>Number ' + (i + 1) + ' of 7</span><span>' + (r.ok ? 'submitted' : 'no score') + '</span></div>' +
      '<div class="target" style="font-size:clamp(40px,11vw,64px)">' + fmtT(r.target) + '</div>' + body + '</div>' +
      '<div class="row"><button class="btn" id="next">' + (last ? 'See results' : 'Next number') + '</button></div>';
    document.getElementById('next').onclick = function () {
      if (cancelAnim) { cancelAnim(); cancelAnim = null; }
      if (last) { S.phase = 'done'; save(); renderDone(); } else { S.idx = i + 1; beginRound(); }
    };
    document.getElementById('next').focus({ preventScroll: true });
    if (!r.ok) return;
    whenAnalysis(i).then(function (an) {
      if (r.tier < 0 || !r.thr) { r.tier = r.fudge ? 8 : C.tierIndex(an, r.cost); r.thr = an.thresholds; save(); }
      if (S.phase !== 'reveal' || S.idx !== i) return;
      var P = r.thr.map(function (x) { return x * 10; });
      if (r.tier < 8) document.getElementById('ruler').innerHTML = rulerHtml(P);
      if (r.shown) { setMark(P, r.pts); finishTierUi(r, false); return; }
      setMark(P, 0);
      var lastN = -1, lastT = 0;
      cancelAnim = animate(1500, function (p) {
        var cur = r.pts * p, n = Math.round(cur);
        setPts(n); setMark(P, cur);
        var now = performance.now();
        if (n !== lastN && now - lastT > 55) { lastT = now; SFX.count(p); }
        lastN = n;
      }, function () {
        cancelAnim = null; r.shown = true; save();
        setPts(r.pts); setMark(P, r.pts);
        finishTierUi(r, true);
        var o = centerOf(document.querySelector('.pts'));
        SFX.reveal(r.tier); Confetti.burst(r.tier, o[0], o[1]);
      });
    });
  }
  function finishTierUi(r, pop) {
    var slot = document.getElementById('tslot'); if (!slot) return;
    slot.innerHTML = tierPill(r.tier, true, pop);
    var d = document.getElementById('tdesc'); d.textContent = TIERS[r.tier][1]; if (pop) d.classList.add('fade-in');
  }

  /* ---------- results ---------- */
  function renderExampleBody(i) {
    var el = document.getElementById('exb-' + i); if (!el) return;
    var ex = examples[i], r = S.results[i];
    if (!ex) { el.innerHTML = '<span class="pending">searching...</span>'; return; }
    el.innerHTML = ex.map(function (e, t) {
      return '<div class="exrow' + (r.ok && r.tier === t ? ' mine' : '') + '"><div>' + tierPill(t) + '</div><div class="mono small muted">' + (e ? e.pts : '') + '</div><div class="xe">' + (e ? esc(e.text) : '<span class="muted">none found</span>') + '</div></div>';
    }).join('');
  }
  function renderExamples() {
    var host = document.getElementById('exlist'); if (!host) return;
    host.innerHTML = '<div class="exlist">' + S.results.map(function (r, i) {
      return '<details><summary><span class="mono">' + fmtT(r.target) + '</span> ' + (r.ok ? tierPill(r.tier) : '<span class="tier" data-t="0" style="opacity:.5">missed</span>') + '</summary><div id="exb-' + i + '"></div></details>';
    }).join('') + '</div>';
    for (var i = 0; i < 7; i++) renderExampleBody(i);
  }
  function renderDone() {
    stopTimers();
    BG.set(totalPts());
    var pending = S.results.some(function (r) { return r.ok && !(r.tier >= 0); });
    if (pending) {
      app.innerHTML = mast() + pips() + '<div class="card"><span class="pending">calculating overall tier...</span></div>';
      Promise.all(S.results.map(function (r, i) { return r.ok && !(r.tier >= 0) ? whenAnalysis(i).then(function (an) { r.tier = r.fudge ? 8 : C.tierIndex(an, r.cost); r.thr = an.thresholds; }) : null; }))
        .then(function () { save(); if (S.phase === 'done') renderDone(); });
      return;
    }
    var total = S.results.reduce(function (a, r) { return a + r.pts; }, 0);
    var ov = overallTier(S.results), fresh = !S.doneShown;
    var rows = S.results.map(function (r) {
      return '<div class="res"><div class="n">' + fmtT(r.target) + '</div><div class="e">' + (r.ok ? esc(r.text) : '<span>no score</span>') + '</div><div class="p">' + r.pts + '</div>' +
        '<div class="tcell">' + (r.ok ? tierPill(r.tier) : '<span class="tier" data-t="0" style="opacity:.5">missed</span>') + '</div></div>';
    }).join('');
    var tiers = {0:"common", 1:"uncommon", 2:"rare", 3:"obscure", 4:"legendary", 5:"mythic", 6:"unheard", 7:"unforeseen", 8:"bro tried"}
    var counts = new Map();
    S.results.forEach(function (r) {
       var key = r.ok ? r.tier : -1;
       counts.set(key, (counts.get(key) || 0) + 1);
    });
    var squares = Array.from(counts, function ([tier, count]) {
       return tier === -1 ? `⬛ no answer x${count}` : `${SQUARES[tier]} ${tiers[tier]} x${count}`;
    }).join('\n') + '\n';
    var text = 'Sevenfold No. ' + num + '\n' + total + ' points' + (ov >= 0 ? ' - overall: ' + TIERS[ov][0] : '') + '\n' + squares + 'Can you beat my score?\nhttps://sevenfold-game.github.io';
    app.innerHTML = mast() + pips() +
      '<div class="card"><h2>Today\'s score</h2><div class="pts"><span id="tot">' + (fresh ? 0 : total) + '</span><small>points</small></div>' +
      '<div class="overall"><div class="lab">Overall tier</div><div id="ovslot">' + (fresh ? '' : (ov >= 0 ? tierPill(ov, true) : '')) + '</div>' +
      '<div class="muted small" id="ovdesc">' + (fresh ? '' : (ov >= 0 ? TIERS[ov][1] : 'Nothing was submitted today, wow.')) + '</div></div>' +
      '<h1>Go on, share your results!</h1>' + 
      '<div class="row" style="margin-top:16px"><button class="btn" id="copy">Copy text</button><button class="btn ghost" id="img">Share as image</button></div>' +
      '<div id="sharepanel"></div></div>' +
      '<div class="card"><h2>Results</h2><div class="rows' + (fresh ? ' stag' : '') + '">' + rows + '</div></div>' +
      '<div class="card"><h2>Tier examples</h2><p class="muted small" style="margin:0 0 12px">These are some example expressions for each tier. Your own tier is highlighted for convenience.</p>' +
      '<button class="btn ghost sm" id="exbtn">Show examples</button><div id="exlist"></div></div>' +
      '<div class="card"><h2>Next numbers in</h2><div class="pts" style="font-size:34px" id="cd">--:--:--</div></div>';
    document.getElementById('copy').onclick = function () {
      var b = this;
      var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy text'; }, 1600); };
      var fb = function () { document.getElementById('sharepanel').innerHTML = '<textarea readonly rows="4" style="width:100%;margin-top:12px;font-family:var(--f-mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px">' + esc(text) + '</textarea>'; var ta = document.querySelector('#sharepanel textarea'); ta.focus(); ta.select(); };
      try { navigator.clipboard.writeText(text).then(done, fb); } catch (e) { fb(); }
    };
    document.getElementById('img').onclick = function () { openShareImage(this, total, ov); };
    document.getElementById('exbtn').onclick = function () { exOpen = true; this.remove(); renderExamples(); requestExamples(); };
    requestExamples();
    var cd = document.getElementById('cd');
    function cdTick() {
      var now = new Date(), next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
      var s = Math.max(0, Math.floor((next - now.getTime()) / 1000)), p = function (n) { return String(n).padStart(2, '0'); };
      cd.textContent = p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
      if (s === 0) location.reload();
    }
    cdTick(); clockTimer = setInterval(cdTick, 1000);
    if (fresh) {
      var lastT = 0;
      cancelAnim = animate(1700, function (p) {
        var el = document.getElementById('tot'); if (el) el.textContent = Math.round(total * p);
        var now = performance.now(); if (now - lastT > 60) { lastT = now; SFX.count(p); }
      }, function () {
        cancelAnim = null; S.doneShown = true; save();
        var el = document.getElementById('tot'); if (!el) return; el.textContent = total;
        document.getElementById('ovslot').innerHTML = ov >= 0 ? tierPill(ov, true, true) : '';
        var d = document.getElementById('ovdesc'); d.textContent = ov >= 0 ? TIERS[ov][1] : 'Nothing was locked in today.'; d.classList.add('fade-in');
        if (ov >= 0) { var o = centerOf(document.querySelector('.pts')); SFX.reveal(ov, true); Confetti.burst(ov, o[0], o[1]); }
      });
    }
  }
  function openShareImage(btn, total, ov) {
    var panel = document.getElementById('sharepanel');
    btn.disabled = true; panel.innerHTML = '<p class="pending" style="margin:12px 0 0">drawing your card…</p>';
    drawShareCard({ num: num, date: date, total: total, overall: ov, results: S.results }).then(function (out) {
      btn.disabled = false;
      var canCopy = !!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write);
      panel.innerHTML = '<div class="sharepanel"><img class="share-img" alt="Result card" src="' + out.url + '"><div class="stack">' +
        (DL ? '<button class="btn sm" id="savei">Save image</button>' : '') + (canCopy ? '<button class="btn ghost sm" id="copyi">Copy image</button>' : '') +
        '<div class="small muted" id="imsg">' + (DL ? '' : 'Press and hold or right-click to save this.') + '</div></div></div>';
      var msg = function (t) { var m = document.getElementById('imsg'); if (m) m.textContent = t; };
      var sv = document.getElementById('savei');
      if (sv) sv.onclick = function () { DL.save({ filename: 'sevenfold-' + num + '.png', data: out.blob }).then(function () { msg('Saved.'); }, function (err) { msg(err && err.code === 'declined' ? 'Save cancelled.' : 'Saving is unavailable. Press and hold to save this instead.'); }); };
      var cp = document.getElementById('copyi');
      if (cp) cp.onclick = function () { navigator.clipboard.write([new ClipboardItem({ 'image/png': out.blob })]).then(function () { msg('Image copied.'); }, function () { msg('Copying is unavailable. Press and hold to save this instead.'); }); };
    }).catch(function (err) {
      btn.disabled = false;
      panel.innerHTML = '<p class="small" role="alert" style="margin:12px 0 0;color:var(--bad)">Could not create the image. ' +
        esc(err && err.message ? err.message : 'Please try again or use Copy text.') + '</p>';
    });
  }

  /* ---------- boot ---------- */
  document.addEventListener('visibilitychange', function () { if (!document.hidden && C.utcDateString(Date.now()) !== date) location.reload(); });
  BG.jump(visiblePts());
  startAnalysis();
  if (S.phase === 'play') {
    if (Date.now() - S.start >= ROUND_MS) finishRound('time'); else renderPlay();
  } else if (S.phase === 'reveal') renderReveal();
  else if (S.phase === 'done') renderDone();
  else renderIntro();
})();
</script>
</body></html>
